<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Shopper ทุกหน้าจอ โหมดปกติ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&amp;family=Chakra+Petch:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 3552px; height: 1900px; box-sizing: border-box; padding: 40px 48px; background: #e7e0d6; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 48px; align-content: start; font-family: 'Anuphan', sans-serif; color: #2b2420">
  <sc-for list="{{screens}}" as="sc" hint-placeholder-count="15">
    <div style="width: 390px; display: flex; flex-direction: column; gap: 14px">
      <div style="width: 390px; height: 844px; border-radius: 36px; overflow: hidden; box-shadow: 0 0 0 8px #2b2420, 0 30px 60px -30px rgba(60,40,20,.6)">
        <dc-import name="Shopper" mode="day" scenario="{{sc.id}}" hint-size="390px,844px"></dc-import>
      </div>
      <div style="display: flex; gap: 10px; align-items: baseline; padding: 0 6px">
        <span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 14px; color: #b4471a">{{sc.n}}</span>
        <span style="font-size: 17px; font-weight: 600">{{sc.label}}</span>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":3552,"height":1900}}'>
class Component extends DCLogic {
  renderVals() {
    const list = [
      ['login', 'เข้าสู่ระบบ / Guest'], ['otp', 'กรอกรหัส OTP'], ['connect', 'เชื่อมตะกร้า'], ['scan', 'สแกน QR'],
      ['pending', 'ยืนยันการหยิบ'], ['multi', 'หลายรายการรอยืนยัน'], ['return', 'ยืนยันการคืน'], ['staff', 'พนักงานกำลังตรวจ'],
      ['offline', 'การเชื่อมต่อขาดหาย'], ['ready', 'พร้อมชำระเงิน'], ['help', 'ขอความช่วยเหลือ'], ['checkout', 'ตรวจสอบก่อนชำระ'],
      ['receipt', 'ใบเสร็จ (Guest)'], ['history', 'ประวัติใบเสร็จ'], ['profile', 'ฉัน / ตั้งค่า']
    ];
    return { screens: list.map(function (x, i) { return { id: x[0], label: x[1], n: String(i + 1).padStart(2, '0') }; }) };
  }
}
</script>
</body>
</html>
